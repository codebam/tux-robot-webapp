name = "tux-robot-webapp"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-06-04"
pages_build_output_dir = ".svelte-kit/cloudflare"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "CONVERSATION_HISTORY"
id = "7c147881ce7d42b8811bfbf8c38e3ee4"

[[r2_buckets]]
binding = "R2"
bucket_name = "share"

[[services]]
binding = "AI_WORKFLOW"
service = "ai-workflow"

[env.development]
name = "tux-robot-webapp-dev"

[env.development.ai]
binding = "AI"

[[env.development.kv_namespaces]]
binding = "CONVERSATION_HISTORY"
id = "7c147881ce7d42b8811bfbf8c38e3ee4"

[[env.development.r2_buckets]]
binding = "R2"
bucket_name = "share"

[[env.development.services]]
binding = "AI_WORKFLOW"
service = "ai-workflow-dev"
